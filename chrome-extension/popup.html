<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 12px -apple-system, BlinkMacSystemFont, sans-serif; width: 260px; margin: 0; padding: 12px; background: #111; color: #ddd; }
  h1 { font-size: 12px; margin: 0 0 8px; color: #6cf; letter-spacing: 0.05em; text-transform: uppercase; }
  label { display: block; margin: 8px 0 2px; color: #888; }
  input[type=number] { width: 100%; box-sizing: border-box; background: #1a1a1a; color: #ddd; border: 1px solid #333; padding: 4px 6px; border-radius: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .ok { background: #4c8; }
  .bad { background: #c44; }
  .speakers { margin-top: 8px; padding: 6px 8px; background: #181818; border-radius: 3px; min-height: 18px; }
  .speakers .name { color: #6cf; }
  .empty { color: #555; }
  button { background: #222; color: #ddd; border: 1px solid #444; padding: 4px 8px; border-radius: 2px; cursor: pointer; }
</style>
</head>
<body>
  <h1>VoxTerm Meet Bridge</h1>

  <div class="row">
    <span><span id="dot" class="dot bad"></span><span id="status">disconnected</span></span>
    <span id="tiles" style="color:#888"></span>
  </div>

  <div class="speakers" id="speakers"><span class="empty">no active speakers</span></div>

  <label for="port">Localhost port</label>
  <input id="port" type="number" min="1024" max="65535" />

  <div class="row">
    <label style="margin:0; display:flex; align-items:center; gap:6px;">
      <input id="debug" type="checkbox" /> debug logs
    </label>
    <button id="reload">reload tab</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
